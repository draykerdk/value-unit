schema_version: 1
component:
  id: valueunit
  name: Value unit
  layer: APPLICATION
  artifact_type: architecture
  problem: "Distributing resources in an organization without a head office needs a unit that can hold a rule."
  scope:
    - "Public description of autonomous value unit."
    - "Public description of resource-distribution ecosystem."
    - "Public description of an accounting record before any unit that moves."
    - "Public description of relation to DAF federative points."
    - "Public description of rules travelling with the unit."
  non_scope:
    - "A token, a currency, an investment or a promise of return."
    - "An operating distribution of resources of any kind."
    - "Any claim about income, support payments or sustaining anyone financially."
    - "Automated allocation by Dk before the human rules are written down."
  dependencies:
    - daf
    - dfmpproject
  implementation:
    level: none
    scope: This repository publishes a charter and open questions; nothing is implemented.
    evidence:
      - type: document
        ref: README.md
  risks:
    - Design language may be mistaken for an available capability.
    - The absence of a specification can leave contributions without a clear target.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/value-unit/issues
  source_of_truth:
    repository: https://github.com/draykerdk/value-unit
    path: README.md
  last_reviewed: "2026-08-11"
