schema_version: 1
component:
  id: valueunit
  name: Value unit
  layer: ORGANIZATION
  artifact_type: architecture
  problem: "Distributing resources and relating external material needs to a distributed supersystem needs an accountable capacity accounting language without financial speculation."
  scope:
    - "Public description of Dktron as the unit of personal capacity rights, recorded in one ledger alongside common reserves and project custody."
    - "Public description of non-deterministic resource distribution under contextual and contestable rules."
    - "Public description of temporary custody: project capacity stays bound to its purpose, and a surplus returns to common reserves, stays reserved for a planned phase or is reallocated by a new decision."
    - "Public description of personal member Dktron: accumulable, transferable, and immune to inactivity confiscation or passive rentier yield."
    - "Public description of conversion into local currency through lawful bridges for member material sustenance based on real material liquidity reserves."
    - "Public description of provenance, purpose, permissions and accountable review."
    - "Public description of an accounting record before an operating unit."
    - "Public separation from DAF federative points and general reputation."
    - "Public description of relation to the internal capacity economy and plutocratic immunity."
    - "The reward earned by financing the network or contributing capacity to it, such as lent computing: the only transferable reputation, which can give faster or priority access to resources, with no weight in member choices."
    - "Public description of the two sides of the ledger (the balance a person can mobilise and the material commitment of the network) and its three rules: no resource counted at once as reserve and free budget, transfer changes the holder without a second right, contextual allocation kept separate from the settlement of rights. A Dktron balance does not buy priority; the reward does."
    - "Public description of the treasury and external interface: expenses and revenues with the world outside the network, and the flow from external resources to internal capacity and back."
  non_scope:
    - "An issued speculative token, volatile cryptocurrency, investment, security or financial product."
    - "Perpetual property or passive rentier accumulation of idle capacity or hardware."
    - "An operating distribution of resources today."
    - "Any guarantee of yield, appreciation, liquidity or income. Support for members through the common floor is specified in Distributed Support."
    - "Confiscation or seizure of personal member balances based on inactivity."
    - "Automated allocation by Dk outside the constitution, its systemic safeguards or the review that a well-justified member veto obliges."
    - "Buying member status, the reputation of work or weight in member choices with money."
  dependencies:
    - daf
    - dfmpproject
  implementation:
    level: none
    scope: This repository publishes the current architectural formulation and open requirements; nothing is implemented.
    evidence:
      - type: document
        ref: README.md
  risks:
    - Currency or token language can create speculative financial expectations before legal and accounting boundaries are understood.
    - The absence of a specification can leave contributions without a clear target.
    - Temporary custody rules must be strictly stated to prevent rentier accumulation.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/value-unit/issues
  source_of_truth:
    repository: https://github.com/draykerdk/value-unit
    path: README.md
  last_reviewed: "2026-10-21"
