schema_version: 1
component:
  id: valueunit
  name: Value unit
  layer: ORGANIZATION
  artifact_type: architecture
  problem: "Drayker needs a stable representation of available and distributed resources that projects can spend under their own authority and that can bridge external exchange without pricing reputation."
  scope:
    - "Public description of the external economy and internal capacity boundary."
    - "Public description of Dktron as the proposed stable representation of resources."
    - "Public description of value, reputation and DAF points as distinct concepts."
    - "Public description of project and category funds and an accountable ledger."
    - "Public description of project spending authority inside an allocated fund."
    - "Public description of external negotiation through proposed Drayker bridge infrastructure."
    - "Stable value as an architectural requirement requiring specification and evidence."
    - "Public description of an accounting record before any unit that moves."
  non_scope:
    - "A token, currency, investment, security or financial product available today."
    - "An operating distribution of resources of any kind."
    - "Any current guarantee of stability, appreciation, yield, liquidity, exchangeability, income or support payments."
    - "A price for reputation, membership, voting rights or human worth."
    - "An internal market where basic capacity is sold to members."
    - "Automated allocation by Dk without constitutional rules, accountable authorization and review."
    - "Unverified rates, stabilization mechanisms or monetary claims treated as current guarantees."
  dependencies:
    - daf
    - dfmpproject
  implementation:
    level: none
    scope: This repository publishes the current architectural formulation and open requirements; nothing is implemented.
    evidence:
      - type: document
        ref: README.md
  risks:
    - Design language may be mistaken for an available capability.
    - The absence of a specification can leave contributions without a clear target.
    - Intelligent or autonomous language can obscure that Dk performs contextual synthesis while consequential allocations still require accountable authorization and review.
    - Removing all monetary language may erase Dktron's resource-representation and external-exchange roles.
    - Stable-value language may be mistaken for a demonstrated peg or financial guarantee.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/value-unit/issues
  source_of_truth:
    repository: https://github.com/draykerdk/value-unit
    path: README.md
  last_reviewed: "2026-08-17"
