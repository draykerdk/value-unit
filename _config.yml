title: "Value unit"
description: "Dktron — the proposed stable representation of resources available to Drayker and distributed among project and category funds, with external exchange through Drayker bridges. Reputation is a different system; stable value is an architectural requirement, not a current guarantee."
remote_theme: draykerdk/drayker-theme
url: "https://value.drayker.org"
dk_kicker: "Value and resources"
dk_subdomain: "value.drayker.org"
dk_repo: "https://github.com/draykerdk/value-unit"


# jekyll-remote-theme fetches the shared layout; jekyll-optional-front-matter lets
# README.md render without front matter; the defaults block is what actually applies
# the layout to it. Without all three, GitHub Pages serves bare converted markdown.
plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default

# The official mark, recoloured. Geometry is fixed for every project
# (DRAYKER-MARK.md §2.5); only the globe carries the scope.
dk_accent: "#C9A6FF"  # value carrying rules: adjacent to governance, not to money
